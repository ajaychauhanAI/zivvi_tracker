<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIVVI | LOGIN/SIGNUP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="glow" style="top: -10%; left: -10%;"></div>
<div class="glow" style="bottom: -10%; right: -10%;"></div>

<div class="card" id="auth-container">

    <!-- LOGIN FORM -->
    <div id="login-form">

        <div class="logo-ring">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="white"/>
          </svg>
        </div>
        
        <p id="login-msg" style="color:red; font-size:13px; margin-top:8px;"></p>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access your account</p>

        <div class="input-box">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <input type="password" id="login-password" placeholder="Password" required>
            <span class="eye" onclick="togglePassword('login-password', this)">👁️</span>
        </div>

        <span class="forgot-link" onclick="openReset()">Forgot Password?</span>

        <button onclick="loginUser()" class="btn-glow">Access Account</button>

        <p class="footer-link">
            New here? 
            <span onclick="showRegister()">Create Account</span>
        </p>

    </div>


    <!-- REGISTER FORM -->
    <div id="register-form" class="hidden">

        <div class="logo-ring">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="white"/>
          </svg>
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">Get started by creating your account</p>

        <div class="input-box">
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <input type="password" id="register-password" placeholder="Create Password" required>
            <span class="eye" onclick="togglePassword('register-password', this)">👁️</span>
        </div>

        <button onclick="registerUser()" class="btn-glow">Sign Up Now</button>

        <p class="footer-link">
            Already a member? 
            <span onclick="showLogin()">Sign In</span>
        </p>

    </div>

</div>


<!-- RESET PASSWORD MODAL -->
<div class="modal-overlay" id="reset-modal">

    <div class="card reset-card">

        <h1>Reset Password</h1>

        <p class="reset-desc">
            Enter your email to receive a reset link.
        </p>

        <div class="input-box">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="res">
            <button onclick="forgotPassword()" class="btn-glow">Send Reset Link</button>

            <p class="footer-text">
                <span onclick="closeReset()">Back to Login</span>
            </p>
        </div>

    </div>

</div>

<script src="login.js"></script>
</body>
</html>
