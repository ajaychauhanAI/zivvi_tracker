<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password | ZIVVI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#6a11cb,#ff4d79);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.container {
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 30px;
    width: 360px;
    text-align: center;
    color: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

h2 {
    margin-bottom: 5px;
}

p {
    font-size: 13px;
    opacity: 0.8;
}

/* Input group */
.input-box {
    position: relative;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 14px;
}

/* Eye icon */
.eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg,#ff4d79,#ff758c);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.02);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Message */
.message {
    margin-top: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔐 Reset Password</h2>
    <p>Create a strong new password</p>

    <div class="input-box">
        <input type="password" id="password" placeholder="New Password">
        <span class="eye" onclick="togglePassword('password')">👁️</span>
    </div>

    <div class="input-box">
        <input type="password" id="confirm" placeholder="Confirm Password">
        <span class="eye" onclick="togglePassword('confirm')">👁️</span>
    </div>

    <button id="btn" onclick="resetPassword()">Reset Password</button>

    <div class="message" id="msg"></div>
</div>

<script>

// 🔑 Get token
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if(!token){
    document.getElementById("msg").innerHTML = "❌ Invalid reset link";
}

// 👁️ Show/Hide Password
function togglePassword(id){
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

// 🚀 Reset function
async function resetPassword(){

    const password = document.getElementById("password").value.trim();
    const confirm = document.getElementById("confirm").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    // Validation
    if(!password || !confirm){
        msg.innerHTML = "⚠️ Fill all fields";
        msg.style.color = "#ffcccc";
        return;
    }

    if(password.length < 6){
        msg.innerHTML = "⚠️ Minimum 6 characters required";
        msg.style.color = "#ffcccc";
        return;
    }

    if(password !== confirm){
        msg.innerHTML = "⚠️ Passwords do not match";
        msg.style.color = "#ffcccc";
        return;
    }

    try {
        btn.innerText = "Please wait...";
        btn.disabled = true;

        const res = await fetch('http://localhost:5000/api/auth/reset-password',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ token, newPassword: password })
        });

        const data = await res.json();

        if(res.ok){
            msg.innerHTML = "✅ Password updated successfully!";
            msg.style.color = "#00ffae";

            setTimeout(()=>{
                window.location.href = "login.html";
            },2000);

        } else {
            msg.innerHTML = "❌ " + data.message;
            msg.style.color = "#ffcccc";
        }

    } catch(err){
        msg.innerHTML = "❌ Server error";
        msg.style.color = "#ffcccc";
    }

    finally{
        btn.innerText = "Reset Password";
        btn.disabled = false;
    }
}

</script>

</body>
</html>
